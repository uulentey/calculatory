 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тооны машин</title>
    <link rel="stylesheet" href="style.css">

 </head>
 <body>
    <div id="calculator">
        <input type="text" id="display" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('7')">1</button>
            <button onclick="appendToDisplay('8')">2</button>
            <button onclick="appendToDisplay('9')">1</button>
            <button onclick="appendToDisplay('/')"class="operator">/</button>
            <button onclick="appendToDisplay('4')">3</button>
            <button onclick="appendToDisplay('5')">3</button>
            <button onclick="appendToDisplay('6')">3</button>
            <button onclick="appendToDisplay('*')"class="operator">*</button>
            <button onclick="appendToDisplay('1')">6</button>
            <button onclick="appendToDisplay('2')">6</button>
            <button onclick="appendToDisplay('3')">6</button>
            <button onclick="appendToDisplay('-')"class="operator">-</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="clearDisplay()"class="operator">C</button>
            <button onclick="calculate()"class="operator">=</button>
            <button onclick="appendToDisplay('+')"class="operator">+</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        function appendToDisplay(input) {
            display.value += input;
        }
        function clearDisplay() {
            display.value = '';
        }
        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'Алдаа';
            }
        }
    </script>
 </body>
 </html>
